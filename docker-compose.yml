version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: voip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voip_user
      POSTGRES_PASSWORD: voip_secure_pass
      POSTGRES_DB: voip_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voip_user -d voip_platform']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: voip_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secure_pass
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voip_backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: voip_user
      DATABASE_PASSWORD: voip_secure_pass
      DATABASE_NAME: voip_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_secure_pass
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Next.js Web Portal
  web-portal:
    build:
      context: ./web-portal
      dockerfile: Dockerfile
    container_name: voip_web_portal
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
      NEXT_PUBLIC_WS_URL: ws://backend:3001
    depends_on:
      - backend

  # Next.js Admin Panel
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: voip_admin
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
    depends_on:
      - backend

  # Next.js Marketing Site
  marketing:
    build:
      context: ./marketing
      dockerfile: Dockerfile
    container_name: voip_marketing
    restart: unless-stopped
    ports:
      - '3003:3003'

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: voip_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - web-portal
      - admin-panel
      - marketing

volumes:
  postgres_data:
  redis_data:
